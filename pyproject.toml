[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triple-compounding-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4", "numpy>=2.0,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
